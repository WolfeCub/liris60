[target.'cfg(all(target_arch = "arm", target_os = "none"))']
# Flash a board in BOOTSEL over USB.
runner = "picotool load -u -v -x -t elf"

[build]
target = "thumbv6m-none-eabi" # Cortex-M0 and Cortex-M0+

[alias]
# Host-side Via commands for the central; built for this machine, not the RP2040.
via = "run -q --manifest-path tools/via/Cargo.toml --target host-tuple --"
bootsel = "via bootsel"
reset-layout = "via reset"

[env]
DEFMT_LOG = "info"
KEYBOARD_TOML_PATH =  { value = "keyboard.toml", relative = true }
