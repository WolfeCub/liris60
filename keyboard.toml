[keyboard]
name = "liris60"
product_name = "liris60"
vendor_id = 0x4c4b
product_id = 0x4643
manufacturer = "RMK"
chip = "rp2040"

# Two RP2040-Zeros. Right half is central (USB); left is powered over TRRS.
[layout]
rows = 5
cols = 14
map = """
(0,0,L)  (0,1,L)  (0,2,L)  (0,3,L)  (0,4,L)  (0,5,L)           [3]           (0,8,R)  (0,9,R)  (0,10,R) (0,11,R) (0,12,R) (0,13,R)
(1,0,L)  (1,1,L)  (1,2,L)  (1,3,L)  (1,4,L)  (1,5,L)           [3]           (1,8,R)  (1,9,R)  (1,10,R) (1,11,R) (1,12,R) (1,13,R)
(2,0,L)  (2,1,L)  (2,2,L)  (2,3,L)  (2,4,L)  (2,5,L)  (2,6,L)  [1]  (2,7,R)  (2,8,R)  (2,9,R)  (2,10,R) (2,11,R) (2,12,R) (2,13,R)
(3,0,L)  (3,1,L)  (3,2,L)  (3,3,L)  (3,4,L)  (3,5,L)  (3,6,L)  [1]  (3,7,R)  (3,8,R)  (3,9,R)  (3,10,R) (3,11,R) (3,12,R) (3,13,R)
            [3]            (4,3,L)  (4,4,L)  (4,5,L)  (4,6,L)  [1]  (4,7,R)  (4,8,R)  (4,9,R)  (4,10,R)
"""

# Layers: 0 Dvorak, 1 Gaming, 2 Shift, 3 Lower, 4 Raise.
[aliases]
lbrc = "LeftBracket"
rbrc = "RightBracket"
dlr = "SHIFTED(Kc4)"
ampr = "SHIFTED(Kc7)"
lcbr = "SHIFTED(LeftBracket)"
rcbr = "SHIFTED(RightBracket)"
lprn = "SHIFTED(Kc9)"
rprn = "SHIFTED(Kc0)"
astr = "SHIFTED(Kc8)"
plus = "SHIFTED(Equal)"
tild = "SHIFTED(Grave)"
perc = "SHIFTED(Kc5)"
circ = "SHIFTED(Kc6)"
exlm = "SHIFTED(Kc1)"
at = "SHIFTED(Kc2)"
hash = "SHIFTED(Kc3)"
coln = "SHIFTED(Semicolon)"
lt = "SHIFTED(Comma)"
gt = "SHIFTED(Dot)"
ques = "SHIFTED(Slash)"
dquo = "SHIFTED(Quote)"
unds = "SHIFTED(Minus)"
stab = "SHIFTED(Tab)"
sent = "SHIFTED(Enter)"
esc_ctl = "MT(Escape, LCtrl)"
shift = "MO(2)"
lower = "MO(3)"
raise = "TT(4)"
raise_tg = "TG(4)"
gaming = "TG(1)"
ctl_left = "WM(Left, LCtrl)"
ctl_right = "WM(Right, LCtrl)"
pscr = "PrintScreen"
volu = "AudioVolUp"
vold = "AudioVolDown"
mute = "AudioMute"
play = "MediaPlayPause"
prev = "MediaPrevTrack"
next = "MediaNextTrack"

[keymap]
layers = 5

# Layer 0: Dvorak
[[keymap.layer]]
keys = """
@dlr       @ampr      @lbrc      @lcbr      @rcbr      @lprn                               Equal      @astr      @rprn      @plus      @rbrc      Backspace
Tab        Semicolon  Comma      Dot        P          Y                                   F          G          C          R          L          Slash
@esc_ctl   A          O          E          U          I          Space         Space      D          H          T          N          S          Enter
No         Quote      Q          J          K          X          @lower        LGui       B          M          W          V          Z          Minus
                                 Space      @shift     LAlt       Space         @lower     @shift     LCtrl      Space
"""

# Layer 1: Gaming
[[keymap.layer]]
keys = """
Escape     Kc1        Kc2        Kc3        Kc4        Kc5                                 Kc6        Kc7        Kc8        Kc9        Kc0        Backspace
Tab        Q          W          E          R          T                                   Y          U          I          O          P          Backslash
LCtrl      A          S          D          F          G          _             _          H          J          K          L          Semicolon  Enter
LShift     Z          X          C          V          B          Space         @raise     B          M          Comma      Dot        Slash      RShift
                                 _          LAlt       LAlt       Space         @lower     LCtrl      LShift     _
"""

# Layer 2: Shift
[[keymap.layer]]
keys = """
@tild      @perc      Kc7        Kc5        Kc3        Kc1                                 Kc9        Kc0        Kc2        Kc4        Kc6        Kc8
@stab      @coln      @lt        @gt        SHIFTED(P) SHIFTED(Y)                          SHIFTED(F) SHIFTED(G) SHIFTED(C) SHIFTED(R) SHIFTED(L) @ques
_          SHIFTED(A) SHIFTED(O) SHIFTED(E) SHIFTED(U) SHIFTED(I) _             _          SHIFTED(D) SHIFTED(H) SHIFTED(T) SHIFTED(N) SHIFTED(S) @sent
_          @dquo      SHIFTED(Q) SHIFTED(J) SHIFTED(K) SHIFTED(X) @raise_tg     _          SHIFTED(B) SHIFTED(M) SHIFTED(W) SHIFTED(V) SHIFTED(Z) @unds
                                 _          _          _          Space         Delete     _          @pscr      _
"""

# Layer 3: Lower
[[keymap.layer]]
keys = """
F1         F2         F3         F4         F5         F6                                  _          _          @circ      Grave      @exlm      @hash
F7         F8         F9         F10        F11        F12                                 _          @ctl_left  Up         @ctl_right @at        Backslash
_          _          _          _          _          _          _             _          _          Left       Down       Right      _          _
LShift     _          _          _          _          _          _             @volu      @mute      @play      _          _          _          @gaming
                                 _          _          _          _             @vold      @prev      @next      _
"""

# Layer 4: Raise
[[keymap.layer]]
keys = """
_          _          _          _          _          _                                   _          _          _          _          _          No
_          _          _          _          _          _                                   _          MouseBtn1  MouseUp    MouseBtn2  _          _
_          _          _          _          _          _          _             _          _          MouseLeft  MouseDown  MouseRight _          _
_          _          _          _          _          _          @raise_tg     PageUp     _          _          _          _          _          Insert
                                 _          _          _          _             PageDown   _          @pscr      _
"""

[storage]
# Reload the keymap from this file on boot.
clear_layout = true

[split]
connection = "serial"

# UART over TRRS: tip/ring 1 = GP12/GP13 (crossed between halves), ring 2 = 3V3, sleeve = GND.
[split.central]
rows = 5
cols = 7
row_offset = 0
col_offset = 7
serial = [{ instance = "UART0", tx_pin = "PIN_12", rx_pin = "PIN_13" }]

[split.central.matrix]
matrix_type = "normal"
row2col = true
# Bootloader: hold top-right key while plugging in.
bootmagic = [0, 6]
row_pins = ["PIN_7", "PIN_8", "PIN_9", "PIN_10", "PIN_11"]
col_pins = ["PIN_6", "PIN_5", "PIN_4", "PIN_3", "PIN_2", "PIN_1", "PIN_0"]

[[split.peripheral]]
rows = 5
cols = 7
row_offset = 0
col_offset = 0
serial = [{ instance = "UART0", tx_pin = "PIN_12", rx_pin = "PIN_13" }]

[split.peripheral.matrix]
matrix_type = "normal"
row2col = true
# Bootloader: hold top-left key while plugging in.
bootmagic = [0, 0]
row_pins = ["PIN_7", "PIN_8", "PIN_9", "PIN_10", "PIN_11"]
col_pins = ["PIN_0", "PIN_1", "PIN_2", "PIN_3", "PIN_4", "PIN_5", "PIN_6"]

[rmk]
split_peripherals_num = 1
