[keyboard]
name = "liris60"
product_name = "liris60"
vendor_id = 0x4c4b
product_id = 0x4643
manufacturer = "RMK"
chip = "rp2040"

[keymap]
layers = 6

# Layer 0: Dvorak
[[keymap.layer]]
keys = """
@dlr       @ampr      @lbrc      @lcbr      @rcbr      @lprn                               Equal      @astr      @rprn      @plus      @rbrc      Backspace
Tab        Semicolon  Comma      Dot        P          Y                                   F          G          C          R          L          Slash
@esc_ctl   A          O          E          U          I          _             _          D          H          T          N          S          Enter
_          Quote      Q          J          K          X          @lower        LGui       B          M          W          V          Z          Minus
                                 @raise     @shift     LAlt       Space         @lower     @shift     LCtrl      Backspace
"""

# Layer 1: Gaming
[[keymap.layer]]
keys = """
Escape     No         Kc1        Kc2        Kc3        Kc4                                 Kc6        Kc7        Kc8        Kc9        Kc0        Backspace
Tab        No         Q          W          E          R                                   _          _          _          _          _          _
LCtrl      LShift     A          S          D          F          G             _          _          _          _          _          _          @chat_enter
No         LShift     Z          X          C          V          B             _          _          _          _          _          _          RShift
                                 _          LAlt       LAlt       Space         @lower     LCtrl      LShift     _
"""

# Layer 2: Shift
# Real Shift is held, so transparent keys come out shifted. Keypad digits are placeholders that the forks below turn into unshifted digits.
[[keymap.layer]]
keys = """
Grave      Kc5        Kp7        Kp5        Kp3        Kp1                                 Kp9        Kp0        Kp2        Kp4        Kp6        Kp8
_          _          _          _          _          _                                   _          _          _          _          _          _
_          _          _          _          _          _          _             _          _          _          _          _          _          _
_          _          _          _          _          _          @raise_tg     _          _          _          _          _          _          _
                                 _          _          _          _             Delete     _          @pscr      _
"""

# Layer 3: Lower
[[keymap.layer]]
keys = """
F1         F2         F3         F4         F5         F6                                  _          _          @circ      Grave      @exlm      @hash
F7         F8         F9         F10        F11        F12                                 _          @ctl_left  Up         @ctl_right @at        Backslash
_          _          _          _          _          _          _             _          _          Left       Down       Right      _          _
LShift     _          _          _          _          _          _             @volu      @mute      @play      _          _          _          @gaming
                                 _          LShift     _          _             @vold      @prev      @next      _
"""

# Layer 4: Raise
[[keymap.layer]]
keys = """
_          _          _          _          _          _                                   _          _          _          _          _          _
_          _          _          _          _          _                                   _          MouseBtn1  MouseUp    MouseBtn2  _          _
_          _          _          MouseAccel1 MouseAccel2 _         _             _          _          MouseLeft  MouseDown  MouseRight _          _
_          _          _          _          _          _          @raise_tg     PageUp     _          _          _          _          _          Insert
                                 @raise_tg  _          _          _             PageDown   _          @pscr      _
"""

# Layer 5: Chat
[[keymap.layer]]
keys = """
_          _          _          _          _          _                                   _          _          _          _          _          _
_          _          _          _          _          _                                   _          _          _          _          _          _
@chat_esc  _          _          _          _          _          _             _          _          _          _          _          _          @chat_enter
_          _          _          _          _          _          _             _          _          _          _          _          _          _
                                 _          _          _          _             _          _          _          _
"""

[aliases]
lbrc = "LeftBracket"
rbrc = "RightBracket"
dlr = "SHIFTED(Kc4)"
ampr = "SHIFTED(Kc7)"
lcbr = "SHIFTED(LeftBracket)"
rcbr = "SHIFTED(RightBracket)"
lprn = "SHIFTED(Kc9)"
rprn = "SHIFTED(Kc0)"
astr = "SHIFTED(Kc8)"
plus = "SHIFTED(Equal)"
circ = "SHIFTED(Kc6)"
exlm = "SHIFTED(Kc1)"
at = "SHIFTED(Kc2)"
hash = "SHIFTED(Kc3)"
esc_ctl = "MT(Escape, LCtrl)"
shift = "TD(1)"
lower = "MO(3)"
raise = "TD(0)"
raise_tg = "TG(4)"
gaming = "TG(1)"
ctl_left = "WM(Left, LCtrl)"
ctl_right = "WM(Right, LCtrl)"
pscr = "PrintScreen"
volu = "AudioVolUp"
vold = "AudioVolDown"
mute = "AudioMute"
play = "MediaPlayPause"
prev = "MediaPrevTrack"
next = "MediaNextTrack"
chat_enter = "Macro(0)"
chat_esc = "Macro(1)"

# Match the old QMK config: 150ms tapping term, mod-taps become the modifier as soon as another key is pressed.
[behavior.morse]
hold_on_other_press = true
hold_timeout = "150ms"

# Raise: hold for momentary, double tap to toggle. A single tap does nothing, so it can't lock the layer by accident.
[[behavior.morse.morses]]
hold = "MO(4)"
hold_after_tap = "MO(4)"
double_tap = "TG(4)"

# Shift: tap to shift the next key, hold for the Shift layer, double tap for Caps Word.
[[behavior.morse.morses]]
tap = "OSM(LShift)"
hold = "LM(2, LShift)"
hold_after_tap = "LM(2, LShift)"
double_tap = "CapsWordToggle"

[behavior.combo]
timeout = "30ms"
combos = [
  { actions = ["J", "K"], output = "Escape", layer = 0 },
  { actions = ["Dot", "P"], output = "Tab", layer = 0 },
  { actions = ["M", "W"], output = "Enter", layer = 0 },
  { actions = ["G", "C"], output = "Backspace", layer = 0 },
]

# Shift-layer digits and Delete drop Shift unless Ctrl/Alt/Gui is also held, so Shift+2 types 2
# but Ctrl+Shift+2 reaches the app. Forks always strip match_any mods, so the negative branch re-adds Shift.
[behavior.fork]
forks = [
  { trigger = "Kp0", positive_output = "Kc0", negative_output = "SHIFTED(Kc0)", match_any = "LShift", match_none = "LCtrl | LAlt | LGui | RCtrl | RAlt | RGui" },
  { trigger = "Kp1", positive_output = "Kc1", negative_output = "SHIFTED(Kc1)", match_any = "LShift", match_none = "LCtrl | LAlt | LGui | RCtrl | RAlt | RGui" },
  { trigger = "Kp2", positive_output = "Kc2", negative_output = "SHIFTED(Kc2)", match_any = "LShift", match_none = "LCtrl | LAlt | LGui | RCtrl | RAlt | RGui" },
  { trigger = "Kp3", positive_output = "Kc3", negative_output = "SHIFTED(Kc3)", match_any = "LShift", match_none = "LCtrl | LAlt | LGui | RCtrl | RAlt | RGui" },
  { trigger = "Kp4", positive_output = "Kc4", negative_output = "SHIFTED(Kc4)", match_any = "LShift", match_none = "LCtrl | LAlt | LGui | RCtrl | RAlt | RGui" },
  { trigger = "Kp5", positive_output = "Kc5", negative_output = "SHIFTED(Kc5)", match_any = "LShift", match_none = "LCtrl | LAlt | LGui | RCtrl | RAlt | RGui" },
  { trigger = "Kp6", positive_output = "Kc6", negative_output = "SHIFTED(Kc6)", match_any = "LShift", match_none = "LCtrl | LAlt | LGui | RCtrl | RAlt | RGui" },
  { trigger = "Kp7", positive_output = "Kc7", negative_output = "SHIFTED(Kc7)", match_any = "LShift", match_none = "LCtrl | LAlt | LGui | RCtrl | RAlt | RGui" },
  { trigger = "Kp8", positive_output = "Kc8", negative_output = "SHIFTED(Kc8)", match_any = "LShift", match_none = "LCtrl | LAlt | LGui | RCtrl | RAlt | RGui" },
  { trigger = "Kp9", positive_output = "Kc9", negative_output = "SHIFTED(Kc9)", match_any = "LShift", match_none = "LCtrl | LAlt | LGui | RCtrl | RAlt | RGui" },
  { trigger = "Delete", positive_output = "Delete", negative_output = "SHIFTED(Delete)", match_any = "LShift", match_none = "LCtrl | LAlt | LGui | RCtrl | RAlt | RGui" },
]

# Gaming Enter types Enter and swaps Gaming for Chat; Chat Enter or Esc swaps back.
# Hold Enter/Esc ~20ms: a macro "tap" is only 2ms, which games that poll key state per frame miss.
[[behavior.macro.macros]]
operations = [
  { operation = "tap", keycode = "TG(1)" },
  { operation = "tap", keycode = "TG(5)" },
  { operation = "down", keycode = "Enter" },
  { operation = "delay", duration = "20ms" },
  { operation = "up", keycode = "Enter" },
]

[[behavior.macro.macros]]
operations = [
  { operation = "tap", keycode = "TG(1)" },
  { operation = "tap", keycode = "TG(5)" },
  { operation = "down", keycode = "Escape" },
  { operation = "delay", duration = "20ms" },
  { operation = "up", keycode = "Escape" },
]

[rmk]
# Faster mouse keys (default 20ms).
mouse_key_interval = 10
split_peripherals_num = 1
fork_max_num = 11

[storage]
enabled = false

[layout]
rows = 5
cols = 14
map = """
(0,0,L,@outer) (0,1,L,@pinky) [0.15] (0,2,L,@ring) [0.05] (0,3,L)         [0.05] (0,4,L,@index)  [0.05] (0,5,L,@reach)                           [4.2]                          (0,8,R,@reach)  [0.05] (0,9,R,@index)  [0.05] (0,10,R)         [0.05] (0,11,R,@ring) [0.15] (0,12,R,@pinky) (0,13,R,@outer)
(1,0,L,@outer) (1,1,L,@pinky) [0.15] (1,2,L,@ring) [0.05] (1,3,L)         [0.05] (1,4,L,@index)  [0.05] (1,5,L,@reach)                           [4.2]                          (1,8,R,@reach)  [0.05] (1,9,R,@index)  [0.05] (1,10,R)         [0.05] (1,11,R,@ring) [0.15] (1,12,R,@pinky) (1,13,R,@outer)
(2,0,L,@outer) (2,1,L,@pinky) [0.15] (2,2,L,@ring) [0.05] (2,3,L)         [0.05] (2,4,L,@index)  [0.05] (2,5,L,@reach)         (2,6,L,@inner)    [2.2] (2,7,R,@inner)           (2,8,R,@reach)  [0.05] (2,9,R,@index)  [0.05] (2,10,R)         [0.05] (2,11,R,@ring) [0.15] (2,12,R,@pinky) (2,13,R,@outer)
(3,0,L,@outer) (3,1,L,@pinky) [0.15] (3,2,L,@ring) [0.05] (3,3,L)         [0.05] (3,4,L,@index)  [0.05] (3,5,L,@reach)  [0.35] (3,6,L,@thumb5_l) [1.5] (3,7,R,@thumb5_r) [0.35] (3,8,R,@reach)  [0.05] (3,9,R,@index)  [0.05] (3,10,R)         [0.05] (3,11,R,@ring) [0.15] (3,12,R,@pinky) (3,13,R,@outer)
[2.75]                                                    (4,3,L,@thumb1) [0.05] (4,4,L,@thumb2)        (4,5,L,@thumb3) [0.1]  (4,6,L,@thumb4_l) [3.0] (4,7,R,@thumb4_r) [0.1]  (4,8,R,@thumb3)        (4,9,R,@thumb2) [0.05] (4,10,R,@thumb1)
"""

# Column stagger and thumb cluster in key units, measured off the build photo.
# y nudges a key down and r tilts it, so the tilted thumb pair needs a shape per half.
[layout.shapes]
outer = { y = 0.88 }
pinky = { y = 0.8 }
ring = { y = 0.18 }
index = { y = 0.02 }
reach = { y = 0.05 }
inner = { y = 0.55 }
thumb1 = { y = 0.15 }
thumb2 = { y = 0.12 }
thumb3 = { y = 0.08 }
thumb4_l = { y = 0.38, r = -43.0 }
thumb4_r = { y = 0.38, r = 43.0 }
thumb5_l = { y = 0.66, r = -43.0 }
thumb5_r = { y = 0.66, r = 43.0 }

# Two RP2040-Zeros. Right half is central (USB); left is powered over TRRS.
[split]
connection = "serial"

# UART over TRRS: tip/ring 1 = GP12/GP13 (crossed between halves), ring 2 = 3V3, sleeve = GND.
[split.central]
rows = 5
cols = 7
row_offset = 0
col_offset = 7
serial = [{ instance = "UART0", tx_pin = "PIN_12", rx_pin = "PIN_13" }]

[split.central.matrix]
matrix_type = "normal"
row2col = true
# Bootloader: hold top-right key while plugging in.
bootmagic = [0, 6]
row_pins = ["PIN_7", "PIN_8", "PIN_9", "PIN_10", "PIN_11"]
col_pins = ["PIN_6", "PIN_5", "PIN_4", "PIN_3", "PIN_2", "PIN_1", "PIN_0"]

[[split.peripheral]]
rows = 5
cols = 7
row_offset = 0
col_offset = 0
serial = [{ instance = "UART0", tx_pin = "PIN_12", rx_pin = "PIN_13" }]

[split.peripheral.matrix]
matrix_type = "normal"
row2col = true
# Bootloader: hold top-left key while plugging in.
bootmagic = [0, 0]
row_pins = ["PIN_7", "PIN_8", "PIN_9", "PIN_10", "PIN_11"]
col_pins = ["PIN_0", "PIN_1", "PIN_2", "PIN_3", "PIN_4", "PIN_5", "PIN_6"]
